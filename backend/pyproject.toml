[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mailops-backend"
version = "0.1.0"
description = "FastAPI Backend for MailOps AI work-intelligence platform"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "MailOps AI Team" }
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "psycopg[binary]>=3.1.18",
    "cryptography>=42.0.0",
    "itsdangerous>=2.1.2",
    "pyjwt[crypto]>=2.8.0",
    "httpx>=0.27.0",
    "email-validator>=2.1.0",
    "google-genai>=2.18.1,<3.0.0",
    "pypdf>=4.0.0",
    "pdf2image>=1.17.0",
    "pytesseract>=0.3.10",
    "pillow>=10.0.0",
    "python-docx>=1.1.0",
    "pgvector>=0.2.5",
]



[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
