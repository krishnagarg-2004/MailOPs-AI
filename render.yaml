# Render Infrastructure as Code Blueprint for MailOps AI
# Docs: https://render.com/docs/blueprint-spec

services:
  # 1. FastAPI Backend Service
  - type: web
    name: mailops-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: mailops-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://mailops-frontend.onrender.com
      - key: AI_PROVIDER_TYPE
        value: mock  # Or set to gemini and add GEMINI_API_KEY
      - key: GEMINI_MODEL
        value: gemini-2.5-flash

  # 2. React + Vite Frontend Static Site
  - type: web
    name: mailops-frontend
    env: static
    buildCommand: npm install --prefix frontend && npm run build --prefix frontend
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: mailops-backend
          type: web
          property: host

databases:
  # Managed PostgreSQL Database with pgvector extension support
  - name: mailops-postgres
    plan: starter
    databaseName: mailops_db
    user: mailops_user
